name: Release extension

on:
  workflow_dispatch:
  release:
    types: [published]

# Nothing by default; each job asks for what it needs. Actions are pinned
# to commit SHAs (version in the comment) so a moved or hijacked tag can't
# change what runs; Dependabot proposes updates.
permissions: {}

jobs:
  # Builds once, uploads the zips as a workflow artifact, and (on a real
  # release) attaches them to the GitHub Release. The submit-* jobs below
  # consume the same artifact so a store rejection never re-triggers a
  # rebuild — just re-run the failed submit job from the Actions UI.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the zips to the GitHub Release
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: extension/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Only runs when triggered by a published GitHub Release, so the
      # built version always matches the release tag (e.g. v1.0.2 -> 1.0.2)
      # instead of relying on package.json having been bumped manually
      # beforehand. Manual workflow_dispatch runs build whatever version is
      # already committed.
      - name: Set version from release tag
        if: github.event_name == 'release'
        run: npm pkg set version="${TAG_NAME#v}"
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}

      # Same gates as CI, so a release can never ship code a branch build
      # would have rejected.
      - name: Type-check
        run: pnpm compile

      - name: Lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Generate icons
        run: pnpm generate-icons

      - name: Zip extensions
        run: |
          pnpm zip
          pnpm zip:firefox

      # `actions/upload-artifact@v4` uses `@actions/glob`, which refuses to
      # descend into dot-directories. WXT drops its output in `.output/`, so
      # patterns like `extension/.output/*.zip` silently match nothing. Stage
      # the zips into a non-hidden `dist-zips/` before upload; the submit
      # jobs move them back into `.output/` where `wxt submit` expects them.
      - name: Stage zips for upload
        run: |
          mkdir -p ../dist-zips
          cp .output/*.zip ../dist-zips/
          ls -la ../dist-zips/

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: extension-zips
          path: dist-zips/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Attach zips to the GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            ../dist-zips/*-chrome.zip ../dist-zips/*-firefox.zip ../dist-zips/*-sources.zip \
            --repo "${{ github.repository }}" --clobber

  submit-chrome:
    needs: build
    runs-on: ubuntu-latest
    # The store credentials live in this environment, which requires the
    # owner's approval before the job runs.
    environment: release
    permissions:
      contents: read
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: extension/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: extension-zips
          path: extension/.output

      - name: Submit to Chrome Web Store
        run: pnpm wxt submit --chrome-zip .output/*-chrome.zip
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}

  submit-firefox:
    needs: build
    runs-on: ubuntu-latest
    # The store credentials live in this environment, which requires the
    # owner's approval before the job runs.
    environment: release
    permissions:
      contents: read
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: extension/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: extension-zips
          path: extension/.output

      - name: Submit to Firefox Add-ons
        run: |
          pnpm wxt submit \
            --firefox-zip .output/*-firefox.zip \
            --firefox-sources-zip .output/*-sources.zip
        env:
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
